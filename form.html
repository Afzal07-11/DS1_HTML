<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <fieldset>

    
      <form action="./response.html" name="#" target="_self" method="get">
        <label for="name">UserName:</label>
        <input
          type="text"
          name="name"
          id="name"
          placeholder="Enter your name"
          required
        />
        <br />
        <br />
        <label for="pass">Password:</label>
        &nbsp;
        <input
          type="password"
          name="pass"
          id="pass"
          placeholder="Enter your password"
        />
        <br /><br />
        <label for="email">Email:</label>
        &nbsp; &nbsp; &nbsp;&nbsp;

        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your email"
        />

        <br /><br />
        <label for="gender">Gender:</label>
        &nbsp; &nbsp;
        <input type="radio" name="gender" id="gender" />
        <label for="gender">Male</label>
        <input type="radio" name="gender" id="gender" />
        <label for="gender">Female</label>
        <br /><br />
        <label for="hobb">Hobbies:</label>
        &nbsp;&nbsp;
        <input type="checkbox" name="hobb" id="hobb1" />
        <label for="hobb1">Cricket</label>
        <input type="checkbox" name="hobb" id="hobb2" />
        <label for="hobb2">Football</label>

        <br /><br />

        <label for="dob">DOB:</label>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

        <input type="date" name="dob" id="dob" />

        <br /><br />

        <label for="select">Select a language:</label>
           
        <select name="lang" id="lang">
          <option value="">Select a lang</option>

          <option value="C">C</option>
          <option value="C++">C++</option>
          <option value="JAVA">JAVA</option>
          <option value="Python">Python</option>
        </select>
        <br><br>

        <label for="tel">Phone:</label>
        <input type="tel" name="tel" id="tel">
        <br><br>


        <label for="add">Address:</label>
       <textarea name="add" id="add"></textarea>
       <br><br>

       <label for="attempt">Attempt:</label>
       <input type="number" name="attempt" id="attempt">
       <br><br>


       <label for="resume">Upload Resume:</label>
       <input type="file" name="resume" id="resume">
       <br><br>

       <input type="submit" value="Submit form">
       <input type="reset" name="" id="">
         <br><br>

         
      <label for="url">Home Page:</label>
      <input type="url" name="url" id="url">


      </form>
    </fieldset>
  </body>
</html>
