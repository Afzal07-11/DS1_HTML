<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <fieldset>
      <form action="#" name="#" target="_self" method="get">
        <label for="name">UserName:</label>
        <input
          type="text"
          name="name"
          id="name"
          placeholder="Enter your name"
          required
        />
        <br />
        <br />
        <label for="pass">Password:</label>
        &nbsp;
        <input
          type="password"
          name="pass"
          id="pass"
          placeholder="Enter your password"
        />
        <br /><br />
        <label for="email">Email:</label>
        &nbsp; &nbsp; &nbsp;&nbsp;

        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your email"
        />

        <br /><br />
        <label for="gender">Gender:</label>
        &nbsp; &nbsp;
        <input type="radio" name="gender" id="gender" />
        <label for="gender">Male</label>
        <input type="radio" name="gender" id="gender" />
        <label for="gender">Female</label>
        <br /><br />
        <label for="hobb">Hobbies:</label>
        &nbsp;&nbsp;
        <input type="checkbox" name="hobb" id="hobb1" />
        <label for="hobb1">Cricket</label>
        <input type="checkbox" name="hobb" id="hobb2" />
        <label for="hobb2">Football</label>

        <br /><br />

        <label for="dob">DOB:</label>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

        <input type="date" name="dob" id="dob" />

        <br /><br />

        <label for="select">Select a language:</label>
           
        <select name="lang" id="lang">
          <option value="">Select a lang</option>

          <option value="C">C</option>
          <option value="C++">C++</option>
          <option value="JAVA">JAVA</option>
          <option value="Python">Python</option>
        </select>
      </form>
    </fieldset>
  </body>
</html>
